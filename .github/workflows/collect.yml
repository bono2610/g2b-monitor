name: 나라장터 공고 수집

on:
  schedule:
    - cron: "47 21 * * *"   # 매일 06:47 (한국시간) — UTC 기준 21:47
  workflow_dispatch:
    inputs:
      backfill:
        description: "최근 N일 몰아서 수집 (비우면 평소대로)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests

      - name: 수집 실행
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          G2B_DEBUG: ${{ github.ref_name != 'main' && '1' || '' }}
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            python collector/collect.py ${G2B_DEBUG:+--dry-run} --backfill "${{ github.event.inputs.backfill }}"
          else
            python collector/collect.py
          fi

      - name: 변경사항 저장
        run: |
          git config user.name "g2b-bot"
          git config user.email "g2b-bot@users.noreply.github.com"
          git add data/bids.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
